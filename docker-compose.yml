version: "3.9"

services:
  app:
    build: .
    container_name: streamvault-api
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/streamvault
      - DOWNLOAD_DIR=/app/downloads
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    volumes:
      - downloads:/app/downloads
    depends_on:
      mongo:
        condition: service_started
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: streamvault-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
  downloads:
